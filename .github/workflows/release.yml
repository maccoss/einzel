name: Release

# DST-5: releases are built by CI on a version tag, and nothing distributed is ever
# built locally. Tagging is the human decision; everything after it happens here, on
# a clean checkout, so an asset can always be traced to a commit.
#
# The release is created as a DRAFT. The tag says "build this"; publishing the
# binaries to the world is a second, separate act by a person who has looked at what
# came out. A workflow_dispatch run builds and checksums the same assets and creates
# no release and no tag, so the whole path can be exercised without publishing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v. Builds assets only; creates no release.'
        required: true
        default: '0.0.0-dev'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------------------
  # Decided once and passed down, so a tag build and a dispatch build differ in
  # exactly one place rather than in every job.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building $v"

  # ---------------------------------------------------------------------------
  # The suite is the release gate, and it runs once per platform rather than once
  # per asset: three matrix entries would run it three times, tripling both the
  # wall clock and the chance that one flaky run blocks a release. The CI workflow
  # does not trigger on tags, so without this a release could be cut from a commit
  # whose tests were never run.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test --configuration Release --verbosity minimal

  build:
    name: ${{ matrix.name }}
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # DST-3: Linux is a tarball, engine and CLI only. No installer, no updater.
          - name: linux-x64 CLI
            os: ubuntu-latest
            rid: linux-x64
            asset: einzel-cli-linux-x64
            withShell: false
            archive: tar

          # DST-2: a portable zip, for a machine where installing is not permitted.
          - name: win-x64 CLI
            os: windows-latest
            rid: win-x64
            asset: einzel-cli-win-x64
            withShell: false
            archive: zip

          # The Windows shell, separately: it carries the WPF desktop runtime and is
          # two and a half times the download. Somebody running an agent loop on a
          # build server should not pay for a window they will never open.
          - name: win-x64 shell
            os: windows-latest
            rid: win-x64
            asset: einzel-shell-win-x64
            withShell: true
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Self-contained, and deliberately NOT trimmed.
      #
      # Self-contained because DST-1's rationale is a locked-down instrument PC: an
      # asset that first requires a .NET install is no use there. It costs cold start
      # - measured at 220-250 ms against PERF-8's 500 ms budget, where a
      # framework-dependent build is 73-147 - and about 75 MB of download.
      #
      # Not trimmed because `einzel schema` is generated by reflection over the model
      # document records (AGT-7), with descriptions from the XML doc comments the
      # build already requires. A trimmer cannot see either use, and the failure mode
      # is not a build error: it is a schema quietly less complete than the format it
      # describes, which is the precise drift AGT-7 exists to prevent.
      #
      # Everything is staged into a directory named after the asset, so unpacking
      # gives one folder rather than two hundred files in the download directory.
      - name: Publish CLI and MCP server
        run: |
          dotnet publish src/Einzel.Cli -c Release -r ${{ matrix.rid }} --self-contained true -p:VersionPrefix=${{ needs.version.outputs.version }} -o ${{ matrix.asset }}
          dotnet publish src/Einzel.Mcp -c Release -r ${{ matrix.rid }} --self-contained true -p:VersionPrefix=${{ needs.version.outputs.version }} -o ${{ matrix.asset }}

      - name: Publish the shell
        if: matrix.withShell
        run: dotnet publish src/Einzel.Wpf -c Release -r ${{ matrix.rid }} --self-contained true -p:VersionPrefix=${{ needs.version.outputs.version }} -o ${{ matrix.asset }}

      # What a reader of the archive needs before running anything: what it is, what
      # licence it is under, and that nothing installed it.
      - name: Add the documents
        shell: bash
        run: |
          cp LICENSE README.md ${{ matrix.asset }}/
          cat > ${{ matrix.asset }}/PORTABLE.txt <<EOF
          Einzel ${{ needs.version.outputs.version }} (${{ matrix.rid }}, portable)

          Nothing was installed. Unpack this directory anywhere and run the executables
          in it; add the directory to your PATH to call them by name.

            einzel --help        the command line
            einzel doctor        what this copy can and cannot do
            einzel init myproj   a project with a model that runs

          This build carries its own .NET runtime, so no separate install is needed.
          It never checks for updates and never contacts the network (UPD-9, UPD-2):
          to move to a later version, download it and unpack it beside this one.

          Source, documentation and the living specification:
          https://github.com/maccoss/einzel
          EOF

      # The published binary is run before it is shipped. Not a test of the physics -
      # the suite above is that - but of the thing actually being distributed: a
      # self-contained publish that is missing a runtime asset, or trimmed by an
      # inherited property, fails here and not on somebody's instrument PC.
      - name: Smoke test the published build
        shell: bash
        run: |
          cd ${{ matrix.asset }}
          if [ -f ./einzel.exe ]; then exe=./einzel.exe; else exe=./einzel; fi
          "$exe" --version
          "$exe" doctor
          "$exe" init smoke
          "$exe" run smoke/models/reflectron.json
          "$exe" test smoke
          # Redirected rather than piped to head: GitHub's bash runs with pipefail, so
          # head closing the pipe early would SIGPIPE the writer and fail a release on
          # a schema that had merely grown.
          "$exe" schema > /dev/null
          rm -rf smoke

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar'
        run: tar -czf ${{ matrix.asset }}.tar.gz ${{ matrix.asset }}

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path ${{ matrix.asset }} -DestinationPath ${{ matrix.asset }}.zip -CompressionLevel Optimal

      # Pinned to majors that run on node24, checked by runs.using rather than by the
      # version number: upload-artifact v5 and download-artifact v6 read like current
      # majors and are both still node20, which warns on every job. The CI workflow
      # carries the same note and the command to check.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # DST-4: one SHA256SUMS.txt per release, computed in one place over the assets as
  # they will actually be published. Sums generated per job and concatenated would
  # be sums of files nobody can prove are these files.
  publish:
    name: checksum and draft
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: downloaded

      - name: Collect and checksum
        run: |
          mkdir -p assets
          find downloaded -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} assets/ \;
          cd assets
          sha256sum * > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: assets/*
          if-no-files-found: error

      # Only a tag drafts a release. A dispatch run has produced and checksummed the
      # same assets and stops here, so the path can be exercised without creating a
      # tag or a release nobody asked for.
      - name: Draft the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" assets/* \
            --repo "${{ github.repository }}" \
            --draft \
            --title "Einzel ${{ needs.version.outputs.version }}" \
            --notes "Portable builds, self-contained: no .NET install needed, nothing installed, no updater.

          | asset | what it holds |
          | --- | --- |
          | \`einzel-cli-linux-x64.tar.gz\` | the command line and the MCP server |
          | \`einzel-cli-win-x64.zip\` | the same, for Windows |
          | \`einzel-shell-win-x64.zip\` | those plus the Windows shell |

          Unpack anywhere and run \`einzel --help\`. Verify with \`sha256sum -c SHA256SUMS.txt\`, or \`Get-FileHash\` on Windows.

          \`SPEC.md\` in the repository records every requirement's status and the measurement behind it."
